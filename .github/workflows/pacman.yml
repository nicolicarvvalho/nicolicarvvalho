name: generate animation

on:
  schedule:
    - cron: "0 */24 * * *"
  workflow_dispatch:
  push:
    branches:
    - master
    - main

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: generate github-contribution-grid-snake.svg
        uses: platane/snk@v3
        with:
          github_user_name: nicolicarvvalho
          outputs: |
            dist/github-snake.svg?color_snake=#ff69b4&color_dots=#ebedf0,#fbb6ce,#f687b3,#ed64a6,#b83280
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#ff69b4&color_dots=#161b22,#fbb6ce,#f687b3,#ed64a6,#b83280

      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
